name: Laravel CI
on:
  push:
    branches:
      - dev-refractoring-mysql
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
    - name: Install Composer
      run:
        composer install
    - name: Laravel Test
      run:
        php artisan test



name: Build and Push Docker Image
on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/jethrogit/egis-laravel:latest \
            -t ghcr.io/jethrogit/egis-laravel:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/jethrogit/egis-laravel:latest
          docker push ghcr.io/jethrogit/egis-laravel:${{ github.sha }}