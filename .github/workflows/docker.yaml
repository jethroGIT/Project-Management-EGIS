name: Build and Push Docker Image
on:
  push:
    branches:
      - dev-refractoring-mysql
      - main
permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/jethrogit/egis-laravel:latest \
            -t ghcr.io/jethrogit/egis-laravel:${{ github.sha }} .
      - name: Push Docker Image
        run: |
          docker push ghcr.io/jethrogit/egis-laravel:latest
          docker push ghcr.io/jethrogit/egis-laravel:${{ github.sha }}