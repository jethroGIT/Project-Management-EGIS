services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egis-laravel
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - /var/www/vendor
    networks:
      - egis-network


  node:
    image: dhi.io/node:26-alpine-sfw-dev
    container_name: egis-node
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run build"
    networks:
      - egis-network


networks:
  egis-network:
    external: true